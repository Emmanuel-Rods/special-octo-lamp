name: Pwn Notify Daily Run

on:
  # 1. Trigger via Schedule (Cron)
  # GitHub cron uses UTC time.
  # 10:00 PM IST is 4:30 PM UTC (16:30).
  schedule:
    - cron: "30 16 * * *"

  # 2. Trigger Manually via GitHub UI (workflow_dispatch)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js version 22 (required for native --env-file)
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Step 3: Run your npm script
      - name: Run npm start
        run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PWN_ID: ${{ secrets.PWN_ID }}
